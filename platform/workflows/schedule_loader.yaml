main:
  params: [args]

  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - job_name: railway-ingest-schedule-loader
          - expected_bucket: ${sys.get_env("source_bucket")}
          - record_types:
              - publication
              - tiploc
              - association
              - schedule
          - event_bucket: ${map.get(args, ["data", "bucket"])}
          - event_object: ${map.get(args, ["data", "name"])}
          - event_generation: ${map.get(args, ["data", "generation"])}
          - direct_object: ${map.get(args, "object")}
          - direct_generation: ${map.get(args, "generation")}

    - determine_input:
        switch:
          - condition: ${event_object != null}
            assign:
              - source_bucket: ${event_bucket}
              - source_object: ${event_object}
              - source_generation: ${event_generation}
            next: validate_event_bucket

          - condition: ${direct_object != null}
            assign:
              - source_bucket: ${expected_bucket}
              - source_object: ${direct_object}
              - source_generation: ${direct_generation}
            next: validate_generation

        next: invalid_payload

    - validate_event_bucket:
        switch:
          - condition: ${source_bucket != expected_bucket}
            next: invalid_bucket

        next: validate_generation

    - validate_generation:
        switch:
          - condition: ${source_generation == null}
            next: invalid_generation

        next: validate_object

    - validate_object:
        switch:
          - condition: ${text.match_regex(source_object, "^schedules/(full|update)/sequence=[0-9]+/schedules[.]json[.]gz$")}
            next: load_record_families

        next: invalid_object

    - invalid_payload:
        raise: "Workflow input must be either a Cloud Storage Eventarc event or contain object and generation."

    - invalid_bucket:
        raise: '${"Unexpected source bucket: " + string(source_bucket)}'

    - invalid_generation:
        raise: "Source generation is required."

    - invalid_object:
        raise: '${"Unexpected SCHEDULE object path: " + source_object}'

    - load_record_families:
        parallel:
          for:
            value: record_type
            in: ${record_types}
            steps:
              - run_loader:
                  call: googleapis.run.v1.namespaces.jobs.run
                  args:
                    name: ${"namespaces/" + project + "/jobs/" + job_name}
                    location: ${location}
                    body:
                      overrides:
                        containerOverrides:
                          env:
                            - name: SOURCE_OBJECT
                              value: ${source_object}
                            - name: SOURCE_GENERATION
                              value: ${string(source_generation)}
                            - name: RECORD_TYPE
                              value: ${record_type}
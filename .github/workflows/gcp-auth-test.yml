name: Test GCP WIF

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/955463760385/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: terraform-ci@railway-analytics-508615.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      
      - name: Test Terraform state bucket access
        shell: bash
        env:
          STATE_BUCKET: railway-analytics-508615-terraform-state
        run: |
          set -euo pipefail
      
          echo "Listing bucket..."
          gcloud storage ls "gs://${STATE_BUCKET}"
      
          echo "Writing smoke-test object..."
          echo "hello from GitHub Actions" > smoke-test.txt
          gcloud storage cp smoke-test.txt "gs://${STATE_BUCKET}/smoke-test/smoke-test.txt"
      
          echo "Reading smoke-test object..."
          gcloud storage cat "gs://${STATE_BUCKET}/smoke-test/smoke-test.txt"
      
          echo "Deleting smoke-test object..."
          gcloud storage rm "gs://${STATE_BUCKET}/smoke-test/smoke-test.txt"

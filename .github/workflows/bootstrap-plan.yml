name: Bootstrap Terraform plan

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Bootstrap plan

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: railway-analytics-508615
          workload_identity_provider: projects/955463760385/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: terraform-ci@railway-analytics-508615.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color
main:
  params: [args]

  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - job_name: railway-ingest-schedule-loader
          - record_types:
              - publication
              - tiploc
              - association
              - schedule

    - load_record_families:
        parallel:
          for:
            value: record_type
            in: ${record_types}
            steps:
              - run_loader:
                  call: googleapis.run.v1.namespaces.jobs.run
                  args:
                    name: ${"namespaces/" + project + "/jobs/" + job_name}
                    location: ${location}
                    body:
                      overrides:
                        containerOverrides:
                          env:
                            - name: SOURCE_OBJECT
                              value: ${args.object}
                            - name: SOURCE_GENERATION
                              value: ${string(args.generation)}
                            - name: RECORD_TYPE
                              value: ${record_type}

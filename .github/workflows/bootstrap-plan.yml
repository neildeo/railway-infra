name: Bootstrap Terraform plan

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Bootstrap plan

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Detect bootstrap changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- bootstrap/ .github/workflows/bootstrap-plan.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: railway-analytics-508615
          workload_identity_provider: projects/955463760385/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: terraform-ci@railway-analytics-508615.iam.gserviceaccount.com

      - name: Set up Terraform
        if: steps.changes.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        if: steps.changes.outputs.changed == 'true'
        run: terraform init -input=false

      - name: Validate Terraform
        if: steps.changes.outputs.changed == 'true'
        run: terraform validate

      - name: Plan Terraform changes
        id: terraform-plan
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt

      - name: Update PR plan comment
        if: always() && steps.terraform-plan.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          marker="<!-- terraform-plan:bootstrap -->"

          {
            echo "$marker"
            echo "### Terraform plan — \`bootstrap\`"
            echo
            echo "<details>"
            echo "<summary>Show plan</summary>"
            echo
            echo '```terraform'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          comment_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate |
            jq -r --arg marker "$marker" '
              .[]
              | select(
                  .user.login == "github-actions[bot]"
                  and (.body | contains($marker))
                )
              | .id
            ' |
            head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$(cat comment.md)"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat comment.md)"
          fi
name: Terraform plan

on:
  pull_request:

jobs:
  detect-roots:
    name: Detect changed Terraform roots
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      roots: ${{ steps.roots.outputs.roots }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed Terraform roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          mapfile -t changed_files < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          roots=()

          add_root() {
            local candidate="$1"

            if [[ -d "$candidate" ]] &&
               [[ ! " ${roots[*]} " =~ " ${candidate} " ]]; then
              roots+=("$candidate")
            fi
          }

          for file in "${changed_files[@]}"; do
            case "$file" in
              platform/*)
                add_root "platform"
                ;;
              .github/workflows/terraform-plan.yml)
                add_root "platform"
                ;;
            esac
          done

          roots_json="$(
            printf '%s\n' "${roots[@]}" |
              jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          echo "roots=$roots_json" >> "$GITHUB_OUTPUT"
          echo "Terraform roots to plan: $roots_json"

  plan:
    name: Plan (${{ matrix.root }})
    needs: detect-roots

    if: needs.detect-roots.outputs.roots != '[]'

    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.detect-roots.outputs.roots) }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      issues: write

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: railway-analytics-508615
          workload_identity_provider: projects/955463760385/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: terraform-ci@railway-analytics-508615.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform changes
        id: terraform-plan
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt

      - name: Update PR plan comment
        if: always() && steps.terraform-plan.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail

          marker="<!-- terraform-plan:${ROOT} -->"

          {
            echo "$marker"
            echo "### Terraform plan — \`${ROOT}\`"
            echo
            echo "<details>"
            echo "<summary>Show plan</summary>"
            echo
            echo '```terraform'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          comment_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate |
            jq -r --arg marker "$marker" '
              .[]
              | select(
                  .user.login == "github-actions[bot]"
                  and (.body | contains($marker))
                )
              | .id
            ' |
            head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$(cat comment.md)"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat comment.md)"
          fi
      
  plan-check:
    name: Terraform plan
    needs:
      - detect-roots
      - plan

    if: always()

    runs-on: ubuntu-latest

    env:
      ROOTS: ${{ needs.detect-roots.outputs.roots }}
      DETECT_RESULT: ${{ needs.detect-roots.result }}
      PLAN_RESULT: ${{ needs.plan.result }}

    steps:
      - name: Check plan result
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Root detection failed."
            exit 1
          fi

          if [[ "$ROOTS" == "[]" ]]; then
            echo "No non-bootstrap Terraform roots changed."
            exit 0
          fi

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "One or more Terraform plans failed."
            exit 1
          fi

          echo "All Terraform plans succeeded."
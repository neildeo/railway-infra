name: Bootstrap Terraform plan

on:
  pull_request:
    paths:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Bootstrap plan

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Detect bootstrap changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- bootstrap/ .github/workflows/bootstrap-plan.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: railway-analytics-508615
          workload_identity_provider: projects/955463760385/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: terraform-ci@railway-analytics-508615.iam.gserviceaccount.com

      - name: Set up Terraform
        if: steps.changes.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        if: steps.changes.outputs.changed == 'true'
        run: terraform init -input=false

      - name: Validate Terraform
        if: steps.changes.outputs.changed == 'true'
        run: terraform validate

      - name: Plan Terraform changes
        if: steps.changes.outputs.changed == 'true'
        run: terraform plan -input=false -no-color